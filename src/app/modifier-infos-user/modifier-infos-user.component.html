<body>
  <div class="form-container playfair-display-font-bold">
    <h2 class="playfair-display-font-bold">Edit My Information</h2>
    
    <form (ngSubmit)="onSubmit()" #updateForm="ngForm">
      <div class="form-group">
        <input class="form-control playfair-display-font" type="text" id="firstName" [(ngModel)]="userData.firstName" name="firstName" required />
      </div>
      
      <div class="form-group">
        <input class="form-control playfair-display-font" type="text" id="lastName" [(ngModel)]="userData.lastName" name="lastName" required />
      </div>
      
      <div class="form-group">
        <input class="form-control playfair-display-font" type="email" id="email" [(ngModel)]="userData.email" name="email" required />
      </div>
      
      <div class="form-group">
        <input class="form-control playfair-display-font" type="password" id="password" [(ngModel)]="password" name="password" />
      </div>
      
      <div class="form-group2">
        <button type="submit" class="btn-submit playfair-display-font-bold">Save Changes</button>
      </div>
    </form>
  </div>
</body>
