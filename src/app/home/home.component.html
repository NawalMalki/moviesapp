
<div class="container">
        <h2 class="alex-brush-regular">Centre de divertissement</h2>
    
        <nav class="alex-brush-regular">
            <div class="nav-wrapper">
                <a href="#">Films</a>
                <a href="#">Animes</a>
                <a href="#">Manga</a>
                <a href="#">Films Ghibli</a>
                <a [routerLink]="'/song'">Musique</a>

            </div>
        </nav>
    

        <div class="categories"></div>
        <div class="profile" (click)="toggleProfile()">
                <i class="fas fa-user"></i>
        </div>
    </div>
    

    <div class="profile-sidebar playfair-display-font" *ngIf="isProfileOpen">
        <button class="close-btn" (click)="toggleProfile()">
            <i class="fas fa-times"></i>
        </button>
    
        <h3>{{ userData?.prenom }} {{ userData?.nom }}</h3> 
        <p>{{ userData?.email }}</p>
    
        <div class="profile-actions">
            <button class="playfair-display-font">
                <i class="fas fa-user-edit"></i> Modifier mes informations
            </button>
            <button class="playfair-display-font">
                <i class="fas fa-heart"></i> Consulter mes favoris
            </button >
            <button (click)="logout()" class="playfair-display-font">
                <i class="fas fa-sign-out-alt"></i> Se déconnecter
            </button>
        </div>
    </div>
