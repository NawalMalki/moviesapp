<div class="container">
  <h1>Studio Ghibli Films</h1>
  <div class="film-grid">
    <div *ngFor="let film of films" class="film-card" (click)="viewFilmDetails(film.id)">
      <img [src]="film.image" alt="{{ film.title }}" class="film-image" />
      <h2>{{ film.title }} ({{ film.release_date }})</h2>
      <div class="film-rating">
        <span *ngFor="let star of getStars(film.rt_score)" class="star">{{ star }}</span>
        
        <!-- Cœur animé aligné à droite des étoiles -->
        <button class="heart-button" (click)="toggleFavori(film); $event.stopPropagation()">
          <svg class="heart" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: #ff4f8b; stop-opacity: 1" />
                <stop offset="100%" style="stop-color: #ff7f99; stop-opacity: 1" />
              </linearGradient>
            </defs>
            <path
              class="heart-outline"
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
            <path
              class="heart-fill"
              [ngClass]="{'filled': estFavori(film)}"
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
