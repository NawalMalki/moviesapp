<body>
  <div class="container">
    <app-navbar-diff-css></app-navbar-diff-css>
    
    <h1 class="alex-brush-regular">Wallpapers Studio Ghibli</h1>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>

    <!-- Indicateur de chargement -->
    <div *ngIf="!wallpapers.length && !errorMessage" class="loading">
      Chargement des wallpapers...
    </div>

    <!-- Liste des wallpapers -->
    <div class="film-grid">
      <div *ngFor="let wallpaper of wallpapers" class="film-card" (click)="viewFilmDetails(wallpaper.id)">
        <img [src]="wallpaper.imageUrl" [alt]="wallpaper.title" class="film-image" />
        <h2 class="heading alex-brush-regular">{{ wallpaper.title }}</h2>
        <div class="film-rating">
          <!-- Les étoiles pourraient être adaptées si vous avez un score pour les wallpapers -->
          <span *ngFor="let star of getStars(wallpaper.rt_score || 80)" class="star">{{ star }}</span>
          
          <!-- Cœur animé aligné à droite des étoiles -->
          <button class="heart-button" (click)="toggleFavori(wallpaper); $event.stopPropagation()">
            <svg class="heart" viewBox="0 0 24 24">
              <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color: #ff4f8b; stop-opacity: 1" />
                  <stop offset="100%" style="stop-color: #ff7f99; stop-opacity: 1" />
                </linearGradient>
              </defs>
              <path
                class="heart-outline"
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
              <path
                class="heart-fill"
                [ngClass]="{'filled': estFavori(wallpaper)}"
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
          </button>
        </div>
        <!-- Bouton de téléchargement conservé -->
        <!--a [href]="wallpaper.imageUrl" download class="download-btn">Télécharger</a-->
      </div>
    </div>
  </div>
</body>
