<body class="playfair-display-font">
  <p *ngIf="errorMessage" class="messageErreur playfair-display-font">{{ errorMessage }}</p>
  <div class="container">
    <h2 class="playfair-display-font-bold">Login Page</h2>
    <form (submit)="login(); $event.preventDefault()">
      <div class="form-group">
        <input type="email" class="form-control playfair-display-font" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <input class="form-control playfair-display-font" type="password" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group2 playfair-display-font">
        <button type="submit" class="playfair-display-font-bold">Log In</button>
        <button (click)="forgotPassword()" class="link">Forgot password?</button>
      </div>
    </form>
  </div>
</body>
