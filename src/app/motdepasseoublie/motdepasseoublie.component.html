<div class="container">
    <h2>Réinitialisation du mot de passe</h2>
    <form (submit)="resetPassword(); $event.preventDefault()">
      <div class="form-group">
        <input type="email" class="form-control" [(ngModel)]="email" placeholder="Entrez votre e-mail" required />
      </div>
      <button type="submit" class="btn btn-primary">Envoyer l'email de réinitialisation</button>
    </form>
    <p *ngIf="message">{{ message }}</p>
    <p *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</p>
  </div>
